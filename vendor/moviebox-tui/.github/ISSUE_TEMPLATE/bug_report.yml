name: Bug report
description: Report an issue or unexpected behavior in MovieBox-Tui.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify the issue occurs on the latest release before submitting.
        For general setup questions, use [GitHub Discussions](https://github.com/mesamirh/MovieBox-Tui/discussions).

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I am running the latest release of MovieBox-Tui.
          required: true
        - label: I searched existing issues and confirmed this is not already reported.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened and what you expected instead.
      placeholder: Provide a clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the exact steps to reproduce the issue.
      placeholder: |
        1. Launch `moviebox-tui`
        2. Search for ...
        3. Select ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Error Output or Screenshot
      description: Paste any error status text displayed on screen, terminal output, or attach a screenshot.
      placeholder: Paste error messages or drag and drop screenshots here.
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Android (Termux)
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: dropdown
    id: player
    attributes:
      label: Media Player
      description: The media player configured in Settings (/settings) or launched.
      options:
        - Android Player (Intent Chooser)
        - mpv
        - IINA
        - VLC
        - None / Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Found via `moviebox-tui --version`.
      placeholder: "0.1.20"
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal Emulator
      placeholder: "Ghostty, Kitty, Alacritty, iTerm2, WezTerm, Termux, Windows Terminal, ..."
    validations:
      required: false
